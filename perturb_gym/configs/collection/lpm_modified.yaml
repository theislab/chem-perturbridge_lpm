model_configs:
  - model_id: LPM
    model_args:
      optimizer_name: AdamW
      learning_rate: 0.002
      learning_rate_decay: 0.97
      num_layers: 2
      hidden_dim: 256
      dropout: 0.1
      batch_size: 16384
      embedding_dim: 128
      # num_workers: 0 is required for in-memory data — non-zero workers use the "spawn" multiprocessing
      # context (see plibdata.py:get_data_loader) which duplicates the in-RAM polars DataFrame in every
      # worker. With 26 GB of train data and num_workers=6 that would be ~156 GB per rank, OOMing the node.
      # With in_memory + num_workers=0 there is no I/O during training so prefetch workers aren't needed.
      num_workers: 6
      # Epoch-based checkpointing: save full Lightning checkpoints at chosen epochs.
      # Final schedule = union of `epoch_checkpoint_special` and multiples of
      # `epoch_checkpoint_every_n`. With the values below: epochs {1, 5, 10, 15, 20, ...}.
      # No rolling deletion -- every saved checkpoint stays on disk until removed manually.
      # Files are written as `epoch-NNNN.ckpt` under the per-run results dir's `checkpoints/`.
      # `dict_product` (perturb_gym/configs/access.py:61) treats lists in model_args as
      # grid-search sweeps -- so a literal list value must be wrapped in an outer list.
      # Outer list = sweep candidates (length 1 -> no sweep); inner list = the actual value.
      epoch_checkpoint_special: [[1]]
      epoch_checkpoint_every_n: 5
      # Resume training from a previously saved Lightning checkpoint. The .ckpt is a full
      # snapshot (weights + optimizer + LR scheduler + global_step + current_epoch + RNG),
      # so trainer.fit picks up exactly where the saved run stopped. The path below was
      # written under the legacy step-based scheme (filenames `step-step=NNNNNNNN.ckpt`)
      # but `last.ckpt` is format-identical to what the new CustomEpochCheckpoint writes.
      # Set to null (or remove this line) to start training from random init.
      # Resume disabled: the legacy `last.ckpt` was saved mid-step (step 522000, ~3000 steps
      # before end of epoch 5), and Lightning's mid-epoch fast-forward of the DistributedSampler
      # leaves some ranks with zero batches -> torch.cat([]) crash in on_train_epoch_end.
      # The new CustomEpochCheckpoint writes only at epoch boundaries, which resume cleanly;
      # once this fresh run produces an epoch-NNNN.ckpt, point this back at one of those.
      resume_from_checkpoint: null
      lightning_trainer_pars:
        deterministic: True
        enable_checkpointing: True
        accelerator: gpu
        # DDP: total ranks = num_nodes * devices. Must match run.sh
        # (--nodes == num_nodes, --ntasks-per-node == devices).
        # Target: 50 nodes x 1 GPU = 50 GPUs (preemptible; see run.sh).
        # Effective global batch = batch_size * 50 (e.g. 4096 * 50 = 204_800).
        devices: 1
        num_nodes: 16
        strategy: ddp
        use_distributed_sampler: True
        max_epochs: 50
        # gradient clipping caps per-step gradient norm to 1.0 — protects against finite-but-huge
        # gradients from outlier batches (won't help if grad is already NaN; for that see detect_anomaly).
        #gradient_clip_val: 1.0
        #gradient_clip_algorithm: norm
        #detect_anomaly: True
    save_model_after_training: True
