# Conda layer: Python + scanpy stack. Training uses PyTorch only (no TensorFlow in this repo).
# TensorFlow 2.16 also pins numpy<2 and conflicts with current scanpy / zarr (numpy>=2).
# TensorBoard for Lightning logs is installed via `poetry install` (pyproject dev deps).
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.12.4
  - notebook
  - pip:
    - poetry==2.3.2
